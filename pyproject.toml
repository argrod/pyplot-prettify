[project]
name = "pyplot-prettify"
version = "0.1.0"
authors = [
  {name = "Aran Garrod", email = "aran.garrod@gmail.com"},
]
description = "Some simple pyplot-based plotting helper functions to clean up plots."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "daltonlens>=0.1.5",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "optimizationtestfunctions>=1.0.1",
    "pillow>=12.2.0",
    "pre-commit>=4.5.1",
]
